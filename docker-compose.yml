services:
  tree-education-webofficialpage:
    container_name: tree-education-webofficialpage
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "18082:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Server-side BFF proxy target. Inside Docker, localhost means this frontend container,
      # so the official website must call the IOAS backend through the shared Docker network.
      IOAS_API_BASE_URL: ${IOAS_API_BASE_URL:-http://tree-education-ioas:8080}
    networks:
      - tree-education-network

networks:
  tree-education-network:
    external: true
    name: tree-education-ioas_ioas-network
